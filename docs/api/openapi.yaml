                    type: string
                  total_cost_usd:
                    type: number
                    format: double
                  by_tenant:
                    type: object
                    additionalProperties:
                      type: number

  /api/v1/admin/cost/{tenant_id}:
    get:
      tags:
        - Administration
      summary: Get tenant cost breakdown
      description: Retrieve costs for a specific tenant broken down by agent and skill.
      x-audience: external
      security:
        - AdminKeyAuth: []
      operationId: getCostByTenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            default: 30d
      responses:
        '200':
          description: Tenant cost breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  period:
                    type: string
                  total_cost_usd:
                    type: number
                  by_agent:
                    type: object
                    additionalProperties:
                      type: number
                  by_skill:
                    type: object
                    additionalProperties:
                      type: number

  # ============================================================================
  # MCP Client Management (mcp-registry)
  # ============================================================================

  /api/v1/mcp/servers:
    post:
      tags:
        - MCP Client Management
      summary: Register external MCP server
      description: >
        Register a 3rd-party MCP server for the tenant to use.
        The platform will act as an MCP client connecting to this server.
      x-audience: external
      x-mutating: true
      operationId: registerMCPServer
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
          description: Tenant ID (required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - url
              properties:
                name:
                  type: string
                  example: Claude Desktop
                url:
                  type: string
                  format: uri
                  example: http://localhost:3000/mcp
                auth_config:
                  type: object
                  description: Auth configuration (credentials will be encrypted)
                  additionalProperties: true
      responses:
        '201':
          description: Server registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '400':
          description: Invalid server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - MCP Client Management
      summary: List MCP servers
      description: >
        Retrieve all MCP servers available to the tenant
        (both tenant-scoped and global servers).
      x-audience: external
      operationId: listMCPServers
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of MCP servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPServer'

  /api/v1/mcp/servers/{id}:
    delete:
      tags:
        - MCP Client Management
      summary: Deregister MCP server
      description: Remove an MCP server registration (tenant-scoped only).
      x-audience: external
      x-mutating: true
      operationId: deleteMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Server deregistered
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mcp/servers/{id}/tools:
    get:
      tags:
        - MCP Client Management
      summary: Discover tools from MCP server
      description: >
        Connect to the registered MCP server and list its available tools.
        Results are cached for performance.
      x-audience: external
      operationId: discoverMCPTools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Available tools from server
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPTool'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mcp/servers/{id}/call:
    post:
      tags:
        - MCP Client Management
      summary: Invoke tool on MCP server
      description: >
        Call a specific tool on the registered MCP server.
        Platform acts as the MCP client forwarding the tool call.
      x-audience: external
      x-mutating: true
      operationId: invokeMCPTool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tool_name
              properties:
                tool_name:
                  type: string
                  example: search
                args:
                  type: object
                  description: Tool arguments
                  additionalProperties: true
      responses:
        '200':
          description: Tool invoked; result returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid tool call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # MCP Server (mcp-server)
  # ============================================================================

  /mcp:
    post:
      tags:
        - MCP Server
      summary: MCP JSON-RPC 2.0 endpoint
      description: >
        The MCP protocol endpoint. External MCP clients (Claude Desktop, etc.)
        connect here using JSON-RPC 2.0 over HTTP.

        Supported methods:
        - `initialize` — Start MCP session
        - `tools/list` — Discover available tools (skills + platform APIs + KG tools)
        - `tools/call` — Invoke a tool
      x-audience: external
      x-websocket: false
      security:
        - McpTokenAuth: []
      operationId: handleMCP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
                - id
              properties:
                jsonrpc:
                  type: string
                  enum: ['2.0']
                method:
                  type: string
                  enum: [initialize, tools/list, tools/call]
                params:
                  type: object
                  description: Method-specific parameters
                  additionalProperties: true
                id:
                  type: integer
                  description: Request ID (must be echoed in response)
      responses:
        '200':
          description: MCP JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                required:
                  - jsonrpc
                  - id
                properties:
                  jsonrpc:
                    type: string
                    enum: ['2.0']
                  result:
                    type: object
                    description: Success result object (method-dependent)
                    additionalProperties: true
                  error:
                    type: object
                    description: JSON-RPC error object (if applicable)
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data:
                        type: object
                  id:
                    type: integer
        '400':
          description: Malformed JSON-RPC request
        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workflows:
    get:
      tags:
        - Hybrid Workflows
      summary: List workflows for tenant
      description: Retrieve all workflow registrations for the authenticated tenant
      operationId: listWorkflows
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
          description: Tenant ID
      responses:
        '200':
          description: List of workflow registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowRegistration'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Hybrid Workflows
      summary: Register a new workflow
      description: Create a new workflow (YAML-defined or code reference)
      operationId: createWorkflow
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
          description: Tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - workflow_type
                - trigger_config
              properties:
                id:
                  type: string
                  description: Unique workflow ID
                name:
                  type: string
                  description: Human-readable name
                workflow_type:
                  type: string
                  enum: [yaml, code]
                  description: "yaml for declarative or code for external workflow reference"
                definition:
                  type: object
                  description: "For type=yaml: parsed YAML workflow definition"
                  additionalProperties: true
                workflow_class:
                  type: string
                  description: "For type=code: class name in external Temporal workflow"
                task_queue:
                  type: string
                  description: Temporal task queue name
                trigger_config:
                  type: object
                  description: Trigger configuration (type, cron, webhook_secret, etc.)
                  additionalProperties: true
      responses:
        '201':
          description: Workflow registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [draft, active, paused, archived]
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid workflow definition or YAML syntax error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workflows/{workflow_id}:
    get:
      tags:
        - Hybrid Workflows
      summary: Get workflow registration
      operationId: getWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow registration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Workflow not found

  /api/v1/workflows/{workflow_id}/trigger:
    post:
      tags:
        - Hybrid Workflows
      summary: Trigger workflow execution (manual)
      description: Manually trigger a workflow run with provided inputs
      operationId: triggerWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  description: Workflow input variables
                  additionalProperties: true
      responses:
        '201':
          description: Workflow run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  workflow_id:
                    type: string
                  status:
                    type: string
                  started_at:
                    type: string
                    format: date-time
        '429':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workflows/{workflow_id}/runs:
    get:
      tags:
        - Hybrid Workflows
      summary: List workflow runs
      operationId: listWorkflowRuns
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of workflow runs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    run_id:
                      type: string
                    status:
                      type: string
                    started_at:
                      type: string
                      format: date-time

  /api/v1/workflow-runs/{run_id}:
    get:
      tags:
        - Hybrid Workflows
      summary: Get workflow run details
      operationId: getWorkflowRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow run details
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  workflow_id:
                    type: string
                  status:
                    type: string
                  step_results:
                    type: object
                    description: Per-step execution results
                  output:
                    type: object
                  cost_usd:
                    type: number
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time

  /webhook/{workflow_id}:
    post:
      tags:
        - Hybrid Workflows
      summary: Trigger workflow via webhook (HMAC-validated)
      description: >
        External systems trigger workflows via authenticated webhooks with
        HMAC-SHA256 signature validation, replay protection (5 min window),
        and idempotency key deduplication (24-hour window).
      operationId: webhookTrigger
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature: sha256=<hex>"
        - name: X-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: ISO 8601 timestamp (must be within 5 minutes)
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: UUID for 24-hour deduplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Webhook payload becomes workflow inputs
              additionalProperties: true
      responses:
        '201':
          description: Workflow triggered (or cached if duplicate idempotency key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
        '400':
          description: Missing or invalid signature/timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate Idempotency-Key (returns cached response)

  /mcp/sse:
    get:
      tags:
        - MCP Server
      summary: MCP Server-Sent Events stream
      description: >
        SSE transport for MCP protocol (keepalive stream).
        Currently sends only keepalive events; proactive server-to-client
        events (e.g., tool updates) are not yet implemented.
      x-audience: external
      x-event-stream: true
      security:
        - McpTokenAuth: []
      operationId: handleMCPSSE
      responses:
        '200':
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                type: string
                description: "Keepalive comment frames (: keepalive)"
        '401':
          description: Unauthorized
