image:
  repository: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_REGION.amazonaws.com/a1/bash-executor
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8092

service:
  enabled: true
  type: ClusterIP
  port: 8092

config:
  LOG_LEVEL: "info"
  PORT: "8092"
  MAX_MEMORY_MB: "512"
  MAX_CPU_CORES: "2"
  MAX_TIMEOUT_SECONDS: "3600"
  MAX_OUTPUT_BYTES: "67108864"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8092
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8092
  initialDelaySeconds: 15
  periodSeconds: 20

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: "alb"
  annotations: {}
  hosts: []
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {}
containerSecurityContext: {}
volumes: []
volumeMounts: []
