image:
  repository: CHANGE_ME_ECR_ACCOUNT.dkr.ecr.CHANGE_ME_REGION.amazonaws.com/a1/kg-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8093

service:
  enabled: true
  type: ClusterIP
  port: 8093

config:
  LOG_LEVEL: "info"
  LLM_GATEWAY_URL: "http://llm-gateway:8083"

secretRefs:
  - envVarName: DATABASE_URL
    secretName: postgres-credentials
    secretKey: url

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8093
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8093
  initialDelaySeconds: 15
  periodSeconds: 20

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: "alb"
  annotations: {}
  hosts: []
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {}
containerSecurityContext: {}
volumes: []
volumeMounts: []
